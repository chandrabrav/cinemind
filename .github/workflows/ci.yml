name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: 17
  ANDROID_COMPILE_SDK: 35
  ANDROID_BUILD_TOOLS: 35.0.0

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew :app:ktlintCheck :core:common:ktlintCheck :core:data:ktlintCheck :core:domain:ktlintCheck :core:ui:ktlintCheck

      - name: Run detekt
        run: ./gradlew :app:detekt :core:common:detekt :core:data:detekt :core:domain:detekt :core:ui:detekt

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --scan

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/test*
            **/build/test-results/test*

  instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [28, 31, 34, 35]
        device: [pixel_7_pro, pixel_tablet]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create emulator
        uses: android-actions/create-emulator@v3
        with:
          api-level: ${{ matrix.api-level }}
          device: ${{ matrix.device }}

      - name: Run instrumented tests
        run: ./gradlew connectedAndroidTest --scan

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results-${{ matrix.api-level }}-${{ matrix.device }}
          path: |
            **/build/outputs/androidTest-results/connected*

  build-release:
    name: Build Release APK
    needs: [lint, unit-tests, instrumented-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEYSTORE }}" | base64 -d > app/release-keystore.jks
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create benchmark device
        uses: android-actions/create-emulator@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          device: pixel_7_pro

      - name: Run benchmarks
        run: ./gradlew :benchmark:connectedBenchmarkAndroidTest

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/build/outputs/