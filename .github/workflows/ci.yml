name: Android CI

# All builds run here; nothing Android-related is installed on developer machines.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No Gradle wrapper is committed yet; CI provisions this exact Gradle version instead.
  GRADLE_VERSION: "8.14.3"

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # One permanent debug signing key for every build, so new APKs install over old ones (keeping
      # projects, settings and downloaded models). Stored only as repository secrets.
      - name: Permanent debug signing key
        env:
          KEY_B64: ${{ secrets.CINEMIND_DEBUG_KEYSTORE_BASE64 }}
          KEY_PW: ${{ secrets.CINEMIND_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PW" ]; then
            echo "::warning::CINEMIND_DEBUG_KEYSTORE_BASE64/PASSWORD are not set: this APK is signed with a throwaway key and cannot update an installed CineMind AI."
            exit 0
          fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/cinemind-debug.p12"
          echo "CINEMIND_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/cinemind-debug.p12" >> "$GITHUB_ENV"
          echo "CINEMIND_DEBUG_KEYSTORE_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Report signing identity
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cert=$(python3 .github/scripts/apkcert.py --digest "$apk")
          echo "Debug APK signing certificate SHA-256: \`$cert\` (must stay the same across builds)" >> "$GITHUB_STEP_SUMMARY"
          echo "$cert"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cinemind-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ github.run_number }}
          path: core/data/schemas/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: "**/build/reports/tests/"
          retention-days: 14
          if-no-files-found: ignore

  export-e2e:
    name: Export end-to-end (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Needs this run's APK for the update test.
    needs: build
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/local/.ghcup /usr/share/swift || true
          df -h /

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg (static build, no apt)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Generate test media (ffmpeg)
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |

          d=feature/export/src/androidTest/assets
          mkdir -p "$d"
          ffmpeg -nostdin -loglevel error -y -f lavfi -i testsrc2=size=720x1280:rate=30 -f lavfi -i sine=frequency=440:sample_rate=44100 \
            -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$d/portrait.mp4"
          ffmpeg -nostdin -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=60 -t 2 -c:v libx264 -pix_fmt yuv420p "$d/landscape_silent.mp4"
          ffmpeg -nostdin -loglevel error -y -f lavfi -i testsrc2=size=1200x900 -frames:v 1 "$d/photo.jpg"
          ffmpeg -nostdin -loglevel error -y -f lavfi -i sine=frequency=660:sample_rate=44100 -t 3 -c:a aac "$d/music.m4a"
          ffmpeg -nostdin -loglevel error -y -f lavfi -i color=c=black:size=720x1280:rate=30 -t 2 -c:v libx264 -pix_fmt yuv420p "$d/black.mp4"
          ls -la "$d"
          # Speech-detection test: three 1.2 s "voice" bursts (300 Hz, wobbling) 2 s apart, in a video.
          s=feature/captions/src/androidTest/assets
          mkdir -p "$s"
          ffmpeg -nostdin -loglevel error -y -f lavfi -i color=c=gray:size=320x240:rate=30 \
            -f lavfi -i "aevalsrc=0.5*sin(2*PI*(300+40*sin(2*PI*3*t))*t)*between(mod(t\,2)\,0\,1.2):s=48000:d=6" \
            -t 6 -c:v libx264 -pix_fmt yuv420p -c:a aac -ac 2 "$s/bursts.mp4"
          ls -la "$s"

      - name: Get this run's APK
        uses: actions/download-artifact@v4
        with:
          name: cinemind-debug-${{ github.run_number }}
          path: new-apk

      - name: Get the previous successful build's APK (update baseline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&per_page=20" \
            -q '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].id' || true)
          if [ -n "$prev" ]; then
            num=$(gh api "repos/${{ github.repository }}/actions/runs/$prev" -q .run_number)
            gh run download "$prev" -R "${{ github.repository }}" -n "cinemind-debug-$num" -D baseline || echo "baseline artifact not available"
          fi
          echo "BASE_APK=$(ls baseline/*.apk 2>/dev/null | head -1)" >> "$GITHUB_ENV"
          echo "NEW_APK=$(ls new-apk/*.apk | head -1)" >> "$GITHUB_ENV"
          ls -la baseline new-apk

      - name: Run export test on emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-boot-timeout: 900
          disk-size: 3000M
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The update test runs first (about a minute); a failure is recorded and fails the job
          # afterwards, so the other emulator tests still run.
          script: |
            bash .github/scripts/upgrade-test.sh "$BASE_APK" "$NEW_APK" || touch upgrade-failed.flag
            gradle --continue :feature:export:connectedDebugAndroidTest :feature:captions:connectedDebugAndroidTest :feature:settings:connectedDebugAndroidTest :core:ui:connectedDebugAndroidTest :feature:editor:timeline:connectedDebugAndroidTest --stacktrace

      - name: Update test result
        if: always()
        run: |
          if [ -f upgrade-failed.flag ]; then echo "::error::The update-compatibility test failed (see the emulator step log)."; exit 1; fi
          echo "Update-compatibility test passed."

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-e2e-reports-${{ github.run_number }}
          path: |
            feature/export/build/reports/androidTests/
            feature/captions/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload UI screenshots (both themes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.run_number }}
          path: "**/build/outputs/connected_android_test_additional_output/**/*.png"
          retention-days: 14
          if-no-files-found: warn

  release:
    name: Signed release APK
    needs: build
    runs-on: ubuntu-latest
    # Runs only on main, and only does anything once signing secrets exist in repo settings.
    if: github.ref == 'refs/heads/main'
    env:
      HAS_KEYSTORE: ${{ secrets.CINEMIND_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: env.HAS_KEYSTORE == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          CINEMIND_KEYSTORE_PASSWORD: ${{ secrets.CINEMIND_KEYSTORE_PASSWORD }}
          CINEMIND_KEY_ALIAS: ${{ secrets.CINEMIND_KEY_ALIAS }}
          CINEMIND_KEY_PASSWORD: ${{ secrets.CINEMIND_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.CINEMIND_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export CINEMIND_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cinemind-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Skip notice
        if: env.HAS_KEYSTORE != 'true'
        run: echo "No signing secrets configured; release APK skipped."
