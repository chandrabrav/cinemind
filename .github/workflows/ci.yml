name: Android CI

# All builds run here; nothing Android-related is installed on developer machines.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No Gradle wrapper is committed yet; CI provisions this exact Gradle version instead.
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cinemind-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: "**/build/reports/tests/"
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Signed release APK
    needs: build
    runs-on: ubuntu-latest
    # Runs only on main, and only does anything once signing secrets exist in repo settings.
    if: github.ref == 'refs/heads/main'
    env:
      HAS_KEYSTORE: ${{ secrets.CINEMIND_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: env.HAS_KEYSTORE == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          CINEMIND_KEYSTORE_PASSWORD: ${{ secrets.CINEMIND_KEYSTORE_PASSWORD }}
          CINEMIND_KEY_ALIAS: ${{ secrets.CINEMIND_KEY_ALIAS }}
          CINEMIND_KEY_PASSWORD: ${{ secrets.CINEMIND_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.CINEMIND_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export CINEMIND_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cinemind-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Skip notice
        if: env.HAS_KEYSTORE != 'true'
        run: echo "No signing secrets configured; release APK skipped."
